<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Operator - OH SNAP! Photobox</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
            border-top: 5px solid #ef4444;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }
        /* Styling untuk logo gambar */
        .brand-logo {
            width: 120px;
            height: auto;
            margin-bottom: 10px;
            object-fit: contain;
        }
        .logo-area p {
            font-size: 13px;
            color: #64748b;
            margin-top: 5px;
        }
        form label {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            display: block;
            margin-bottom: 5px;
        }
        form input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }
        form input:focus {
            outline: none;
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }
        form button {
            width: 100%;
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            font-family: inherit;
            transition: background 0.2s;
        }
        form button:hover {
            background: #dc2626;
        }
        .error-msg {
            color: #ef4444;
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <!-- Ganti 'logo.png' dengan nama file logo asli kamu di folder project -->
            <img src="images/logo-icon.jpg" alt="OH SNAP! Logo" class="brand-logo">
            <p>Silakan login sebagai Operator / Admin</p>
        </div>
        <form id="loginForm">
            <label>Email Operator</label>
            <input type="email" id="email" placeholder="adminohsnap@gmail.com" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required>

            <button type="submit">Masuk ke Dashboard</button>
            <div id="errorMsg" class="error-msg">Email atau password salah!</div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const validEmail = "adminohsnap@gmail.com";
            const validPass = "ohsnap123";

            if (email === validEmail && password === validPass) {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'admin.html';
            } else {
                const errorEl = document.getElementById('errorMsg');
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
